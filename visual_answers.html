<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Physics-I Visual Answer Cards</title>
  <link rel="stylesheet" href="visual_answers.css">
</head>
<body>
  <header>
    <p class="eyebrow">PHYSICS-I · VISUAL MEMORY CARDS</p>
    <h1>Learn by seeing</h1>
    <p>One dark card per answer. Read the idea, remember the diagram, then write the boxed equation.</p>
    <a class="back" href="physics.html">← Back to full answers</a>
  </header>
  <main id="cards" class="cards"></main>
  <script>
    const cards = [
      ['2025 · Q1(a)', 'How does light travel through space?', 'Light travels as a transverse electromagnetic wave. E-field and B-field are perpendicular to each other and to the direction of travel. No material medium is needed.', 'c = 1 / √(μ₀ε₀) ≈ 3 × 10⁸ m s⁻¹', `<svg viewBox="0 0 300 150" aria-label="electric and magnetic fields"><path class="wave blue" d="M20 72 Q45 20 70 72 T120 72 T170 72 T220 72 T270 72"/><path class="wave gold" d="M20 72 Q45 124 70 72 T120 72 T170 72 T220 72 T270 72"/><path class="arrow" d="M70 138h190m0 0-12-7m12 7-12 7"/><text x="22" y="18">E</text><text x="22" y="142">B</text><text x="190" y="132">travel</text></svg>`],
      ['2025 · Q1(b)', 'Significance of Maxwell’s equations', 'They connect charge, current, electric field and magnetic field. A changing electric field makes B; a changing magnetic field makes E. Together they predict light.', 'c = 1 / √(μ₀ε₀)', `<svg viewBox="0 0 300 150"><circle class="node" cx="70" cy="75" r="34"/><circle class="node" cx="230" cy="75" r="34"/><text x="47" y="80">E</text><text x="217" y="80">B</text><path class="arrow" d="M105 62h85m0 0-12-7m12 7-12 7"/><path class="arrow reverse" d="M195 88h-85m0 0 12-7m-12 7 12 7"/><text x="126" y="50">∂B/∂t</text><text x="126" y="116">∂E/∂t</text></svg>`],
      ['2025 · Q2(a)', 'Conditions for interference', 'Use coherent waves: same frequency and constant phase difference. The waves must overlap and have the same polarization. Similar amplitudes give clear fringes.', 'Bright: Δ = mλ  |  Dark: Δ = (m + ½)λ', `<svg viewBox="0 0 300 150"><path class="ray blue" d="M20 48h90l60 27 110-27"/><path class="ray gold" d="M20 102h90l60-27 110 27"/><circle class="glow" cx="280" cy="75" r="8"/><text x="20" y="25">wave 1</text><text x="20" y="132">wave 2</text><text x="226" y="62">overlap</text></svg>`],
      ['2025 · Q2(b)', 'Fringe width does not depend on fringe number', 'For bright fringe m: yₘ = mλD/d. Subtract two consecutive positions. The m term disappears, so every fringe gap is equal.', 'β = yₘ₊₁ − yₘ = λD/d', `<svg viewBox="0 0 300 150"><line class="screen" x1="245" y1="15" x2="245" y2="135"/><path class="ray blue" d="M25 75L245 35M25 75L245 65M25 75L245 95M25 75L245 115"/><circle class="dot" cx="245" cy="35" r="5"/><circle class="dot" cx="245" cy="65" r="5"/><circle class="dot" cx="245" cy="95" r="5"/><circle class="dot" cx="245" cy="115" r="5"/><text x="255" y="55">equal β</text></svg>`],
      ['2025 · Q2(c)', 'Newton’s rings: radius of curvature', 'For the m-th dark ring, use Dₘ² = 4mλR. Put the data in the formula and keep all units in centimetres.', 'R = (0.5)² / [4×10×5.9×10⁻⁵] = 105.9 cm ≈ 1.06 m', `<svg viewBox="0 0 300 150"><path class="lens" d="M35 40 Q150 150 265 40"/><line class="plate" x1="25" y1="110" x2="275" y2="110"/><circle class="ring" cx="150" cy="110" r="22"/><circle class="ring" cx="150" cy="110" r="45"/><text x="112" y="25">lens</text><text x="112" y="140">glass plate</text></svg>`],
      ['2025 · Q3(a)', 'Fresnel biprism interference', 'A narrow slit is split into two virtual coherent sources S₁ and S₂. Their beams overlap on a screen and form straight bright and dark fringes.', 'β = λD/d', `<svg viewBox="0 0 300 150"><circle class="source" cx="25" cy="75" r="5"/><path class="prism" d="M105 28L155 75 105 122zM195 28L145 75 195 122z"/><circle class="source" cx="72" cy="57" r="4"/><circle class="source" cx="72" cy="93" r="4"/><path class="ray blue" d="M30 75L72 57M30 75L72 93M72 57L250 75M72 93L250 75"/><line class="screen" x1="250" y1="30" x2="250" y2="120"/><text x="10" y="132">S</text><text x="55" y="48">S₁</text><text x="55" y="112">S₂</text></svg>`],
      ['2025 · Q3(b)', 'Wavelength by Newton’s rings', 'Measure diameters of two dark rings. Subtract their squared diameters to remove the unknown centre order.', 'λ = [Dₘ₊ₚ² − Dₘ²] / (4pR)', `<svg viewBox="0 0 300 150"><circle class="ring" cx="150" cy="75" r="28"/><circle class="ring" cx="150" cy="75" r="52"/><circle class="ring" cx="150" cy="75" r="76"/><text x="132" y="18">Dₘ₊ₚ</text><text x="138" y="142">Dₘ</text></svg>`],
      ['2026 · Q1(a)', 'Maxwell’s equations: short significance', 'Charge creates E. No magnetic monopoles exist. Changing B creates E. Current and changing E create B. These four ideas explain electromagnetic waves.', '∇·E=ρ/ε₀  |  ∇·B=0  |  ∇×E=−∂B/∂t  |  ∇×B=μ₀J+μ₀ε₀∂E/∂t', `<svg viewBox="0 0 300 150"><rect class="box" x="25" y="25" width="250" height="100" rx="10"/><text x="45" y="55">charge → E</text><text x="45" y="82">current → B</text><text x="45" y="109">changing E ↔ changing B</text></svg>`],
      ['2026 · Q1(b)', 'True path difference in reflected light', 'For a thin film of thickness t and refractive index μ, the optical path difference is 2μt cos r. One phase reversal adds λ/2.', 'Δ = 2μt cos r  ;  effective Δ = 2μt cos r + λ/2', `<svg viewBox="0 0 300 150"><path class="film" d="M35 55h230v45H35z"/><path class="ray blue" d="M80 15L125 55M125 55L205 15"/><path class="ray gold" d="M80 135L125 100M125 100L205 135"/><text x="135" y="84">t</text><text x="213" y="22">r</text></svg>`],
      ['2026 · Q2(a)', 'Conditions of interference', 'Remember C-O-P: Coherent sources, Overlapping waves, same Polarization. Similar intensity makes the pattern easy to see.', 'C · O · P → clear fringes', `<svg viewBox="0 0 300 150"><text class="big" x="50" y="92">C</text><text class="big" x="135" y="92">O</text><text class="big" x="220" y="92">P</text><text x="43" y="116">coherent</text><text x="119" y="116">overlap</text><text x="209" y="116">polarized</text></svg>`],
      ['2026 · Q2(b)', 'Refractive index by Newton’s rings', 'Measure the same ring in air and in the liquid. The liquid makes the ring smaller. Divide the squared diameters.', 'μ = D²air / D²liquid', `<svg viewBox="0 0 300 150"><circle class="ring" cx="90" cy="75" r="53"/><circle class="ring goldstroke" cx="215" cy="75" r="32"/><text x="62" y="140">air: larger</text><text x="176" y="140">liquid: smaller</text></svg>`],
      ['2026 · Q2(c)', 'Newton’s rings: radius of curvature', 'Use the same 10th dark-ring formula as the 2025 numerical problem. Substitute λ = 5.9×10⁻⁵ cm and D = 0.5 cm.', 'R = D₁₀²/(4×10λ) ≈ 105.9 cm ≈ 1.06 m', `<svg viewBox="0 0 300 150"><circle class="ring" cx="150" cy="75" r="58"/><circle class="ring goldstroke" cx="150" cy="75" r="28"/><text x="118" y="80">R?</text></svg>`],
      ['2026 · Q3(a)', 'Types of diffraction', 'Fresnel: near field, finite distance, curved wavefront. Fraunhofer: far field, lenses used, plane wavefront.', 'Fresnel = near  |  Fraunhofer = far', `<svg viewBox="0 0 300 150"><circle class="source" cx="28" cy="75" r="7"/><path class="ray blue" d="M40 55L105 35M40 75L105 75M40 95L105 115"/><line class="screen" x1="105" y1="25" x2="105" y2="125"/><path class="ray gold" d="M190 45h80M190 75h80M190 105h80"/><text x="52" y="140">Fresnel</text><text x="208" y="140">Fraunhofer</text></svg>`],
      ['2026 · Q3(b)', 'Perpendicular polarized waves make an ellipse', 'Take Eₓ = a cosωt and Eᵧ = b cos(ωt+δ). Eliminate time using sin²ωt + cos²ωt = 1. The result is the equation of an ellipse.', 'Eₓ²/a² + Eᵧ²/b² − 2EₓEᵧ cosδ/(ab) = sin²δ', `<svg viewBox="0 0 300 150"><ellipse class="ellipse" cx="150" cy="75" rx="92" ry="46"/><line class="axis" x1="25" y1="75" x2="275" y2="75"/><line class="axis" x1="150" y1="20" x2="150" y2="130"/><text x="263" y="68">Eₓ</text><text x="157" y="25">Eᵧ</text></svg>`]
    ];
    const cardsRoot = document.getElementById('cards');
    cardsRoot.innerHTML = cards.map((c, i) => `<article class="card"><div class="number">${String(i + 1).padStart(2, '0')}</div><div class="content"><p class="tag">${c[0]}</p><h2>${c[1]}</h2><p>${c[2]}</p><div class="equation">${c[3]}</div><div class="diagram">${c[4]}</div><p class="remember"><b>Remember:</b> ${i % 3 === 0 ? 'start with the definition, then draw the field diagram.' : i % 3 === 1 ? 'write the boxed formula clearly and explain each symbol.' : 'finish with the physical meaning or final result.'}</p></div></article>`).join('');
  </script>
</body>
</html>
